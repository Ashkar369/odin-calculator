<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator – Ashkar Siyad</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="calc" aria-label="Calculator">
    <div class="display">
      <div class="history" id="history" aria-live="polite"></div>
      <div class="current" id="current" aria-live="polite">0</div>
    </div>

    <div class="keys" id="keys">
      <button class="key key--fn" data-action="clear">AC</button>
      <button class="key key--fn" data-action="backspace" aria-label="Backspace">⌫</button>
      <button class="key key--op" data-op="÷">÷</button>
      <button class="key key--op" data-op="×">×</button>

      <button class="key" data-digit="7">7</button>
      <button class="key" data-digit="8">8</button>
      <button class="key" data-digit="9">9</button>
      <button class="key key--op" data-op="-">−</button>

      <button class="key" data-digit="4">4</button>
      <button class="key" data-digit="5">5</button>
      <button class="key" data-digit="6">6</button>
      <button class="key key--op" data-op="+">+</button>

      <button class="key" data-digit="1">1</button>
      <button class="key" data-digit="2">2</button>
      <button class="key" data-digit="3">3</button>
      <button class="key key--eq" data-action="equals">=</button>

      <button class="key key--zero" data-digit="0">0</button>
      <button class="key" data-action="decimal">.</button>
    </div>
  </main>
  <p class="foot">Keyboard works too: 0–9 . + − * / Enter Backspace Esc · <a href="https://github.com/Ashkar369/odin-calculator">Code on GitHub</a></p>
</body>
</html>
